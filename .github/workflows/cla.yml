name: CLA

# CLA Assistant Lite: contributors sign by commenting on their pull
# request; signatures are kept in the cla-signatures branch of this repo.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/xlsft/companion/blob/main/CLA.md
          branch: cla-signatures
          allowlist: xlsft,dependabot[bot],github-actions[bot]
          custom-notsigned-prcomment: >-
            Thanks for the contribution! Before it can be merged, please read the
            [Contributor License Agreement](https://github.com/xlsft/companion/blob/main/CLA.md)
            and sign it by replying with the comment below.
          custom-allsigned-prcomment: All contributors have signed the CLA. Thank you!
