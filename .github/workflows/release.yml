name: Release

# A v* tag builds the Linux tarballs and AppImages natively per architecture,
# then GoReleaser checksums them, signs checksums.txt with cosign (keyless,
# this workflow's OIDC identity) and publishes the GitHub release.
#
# Changes to the packaging run the same build as a dry run: nothing is
# signed or published, the result is kept as a workflow artifact.
on:
  push:
    tags: ["v*"]
    branches: ["**"]
    paths:
      - .github/workflows/release.yml
      - .goreleaser.yaml
      - Makefile
      - install.sh
      - packaging/**
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .goreleaser.yaml
      - Makefile
      - install.sh
      - packaging/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # A tag usually points at a main commit whose CI already passed; running
  # it again only made a release wait four minutes for the same answer.
  prior:
    name: CI already green
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    outputs:
      green: ${{ steps.check.outputs.green }}
    steps:
      - id: check
        run: |
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&status=success&per_page=1" -q .total_count)
          if [ "$n" -gt 0 ]; then green=true; else green=false; fi
          echo "green=$green" >> "$GITHUB_OUTPUT"
          echo "CI already passed for $GITHUB_SHA: $green" >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ github.token }}

  ci:
    needs: prior
    if: startsWith(github.ref, 'refs/tags/v') && needs.prior.outputs.green != 'true'
    uses: ./.github/workflows/ci.yml

  dist:
    name: dist-linux (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # The runner sets the glibc floor of the binaries (2.39). 22.04
          # would give 2.35, but its PipeWire (0.3.48) lacks the SPA headers
          # the screen-capture grabber needs.
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0
      # Main's Build job saves this cache (x86_64); nothing is saved here.
      - uses: ./.github/actions/go
        with:
          key: build
      - name: System packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev \
            libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev \
            libxfixes-dev libvulkan-dev libpipewire-0.3-dev libspa-0.2-dev pkg-config \
            cmake ninja-build ccache squashfs-tools
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: release-whisper-${{ matrix.arch }}
      - name: Version
        id: version
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) v=${GITHUB_REF_NAME#v} ;;
            *) v=0.0.0-dev.$(git rev-parse --short HEAD) ;;
          esac
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: make whisper
        # Portable ggml (no -march=native): the binary runs on any CPU of
        # the architecture. CPU backend only; GPU backends are a build option.
        run: make whisper WHISPER_NATIVE=OFF WHISPER_CMAKE_EXTRA="-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
      - name: make dist-linux
        run: make dist-linux VERSION=${{ steps.version.outputs.version }}
      - name: Smoke test
        run: |
          name=companion-${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}
          test -f "dist/$name.tar.gz"
          tar -tzf "dist/$name.tar.gz" | sort
          tar -xzf "dist/$name.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/$name/companion" -version
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.AppImage
          if-no-files-found: error

  release:
    needs: [prior, ci, dist]
    # A tag publishes only after CI passed, in this run or earlier for the
    # same commit; a failed check of the earlier run skips ci and so the
    # release. ci is skipped for dry runs; release then only checks the assets.
    if: >-
      ${{ !cancelled() && needs.dist.result == 'success' && (
        needs.ci.result == 'success' ||
        (needs.ci.result == 'skipped' && (needs.prior.outputs.green == 'true' || !startsWith(github.ref, 'refs/tags/')))
      ) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write # keyless cosign signing of checksums.txt
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist-release
          merge-multiple: true
      - uses: sigstore/cosign-installer@v4.1.2
      - name: GoReleaser (publish)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: GoReleaser (dry run)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean --snapshot --skip=publish,sign
      - name: Verify the published signature
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cosign verify-blob dist/checksums.txt --bundle dist/checksums.txt.sigstore.json \
            --certificate-identity-regexp '^https://github.com/xlsft/companion/.github/workflows/release.yml@refs/tags/v.*$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Homebrew tap formula
        run: |
          # The dry run renders the formula too, so the script stays tested.
          v=$(ls dist-release/*-linux-x86_64.tar.gz | sed 's|.*/companion-\(.*\)-linux-x86_64.tar.gz|\1|')
          sh .github/scripts/homebrew-formula.sh "$v" dist/checksums.txt > "$RUNNER_TEMP/companion.rb"
          cat "$RUNNER_TEMP/companion.rb"
          case "$GITHUB_REF" in refs/tags/v*) ;; *) exit 0 ;; esac
          if [ -z "$COMPANION_PACKAGES_TOKEN" ]; then
            echo "::notice::COMPANION_PACKAGES_TOKEN is not set: skipping the xlsft/homebrew-tap update (the release itself is published)"
            exit 0
          fi
          tap="$RUNNER_TEMP/homebrew-tap"
          git clone -q --depth 1 "https://x-access-token:$COMPANION_PACKAGES_TOKEN@github.com/xlsft/homebrew-tap.git" "$tap"
          mkdir -p "$tap/Formula"
          cp "$RUNNER_TEMP/companion.rb" "$tap/Formula/companion.rb"
          cd "$tap"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/companion.rb
          if git diff --cached --quiet; then echo "Formula unchanged"; exit 0; fi
          git commit -q -m "Brew formula update for companion version v$v"
          git push -q origin HEAD
          echo "Updated xlsft/homebrew-tap Formula/companion.rb to $v" >> "$GITHUB_STEP_SUMMARY"
        env:
          # Pushes to xlsft/homebrew-tap; without it the tap is skipped.
          COMPANION_PACKAGES_TOKEN: ${{ secrets.COMPANION_PACKAGES_TOKEN }}
      - name: Summary
        run: |
          {
            echo '### Release assets'
            echo '```'
            cat dist/checksums.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: release-dry-run
          path: |
            dist/checksums.txt
            dist-release/*
